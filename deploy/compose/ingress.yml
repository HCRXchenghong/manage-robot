# 第 10 步任务 6：nginx 入口（第一阶段 WAF）
# 启动：cd deploy/compose && docker compose -f ingress.yml up -d
# 验收：curl -k https://127.0.0.1/ 200；连续 100 次请求见 429；curl -kI 安全头齐全。
services:
  ingress:
    image: nginx:1.27-alpine
    container_name: ra-ingress
    ports:
      - "443:443"
    volumes:
      - ./ingress/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../pki/dev:/etc/nginx/pki:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
