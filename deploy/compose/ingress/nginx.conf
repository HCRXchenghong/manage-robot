# 第 10 步任务 6：入口层（第一阶段 WAF）
# TLS 终结 + 限流 + 安全头 + 隐藏路径禁用；OIDC 留注释位（阶段 2）。
worker_processes 1;
events { worker_connections 512; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    # 限流：10r/s，突发 20（验收：连续 100 次触发 429）
    limit_req_zone $binary_remote_addr zone=ra:10m rate=10r/s;
    limit_req_status 429;

    server {
        listen 443 ssl;
        server_name _;
        ssl_certificate     /etc/nginx/pki/server.crt;
        ssl_certificate_key /etc/nginx/pki/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        # 安全头
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; script-src 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 阶段 2 OIDC 占位（启用时取消注释并部署 dex/IdP）：
        # auth_request /oauth2/auth;
        # location = /oauth2/auth {
        #     internal;
        #     proxy_pass http://dex:5556/verify;
        #     proxy_pass_request_body off;
        #     proxy_set_header Content-Length "";
        # }

        # 禁隐藏路径（.git / .env / .htaccess 等）
        location ~ /\. { deny all; return 404; }

        # WebSocket（fleet 推送 + 终端）
        location /ws/ {
            proxy_pass http://host.docker.internal:9800;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # REST + 静态站
        location / {
            limit_req zone=ra burst=20 nodelay;
            proxy_pass http://host.docker.internal:9800;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
