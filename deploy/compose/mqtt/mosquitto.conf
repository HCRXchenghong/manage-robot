# Mosquitto 开发 Broker（mTLS，第 5b 步）
# 容器内路径：证书挂载在 /mosquitto/certs，配置挂载为 /mosquitto/config/mosquitto.conf

listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key

# mTLS：必须出示由本 CA 签发的客户端证书，否则拒绝连接
require_certificate true
# 车辆身份直接取证书主题（CN=Gateway ID），云端不用另做账号密码。
# 车辆/Gateway/SPIFFE 的三方绑定由 Fleet registry 在 mTLS 激活后保存。
use_identity_as_username true
allow_anonymous false

# 绝不允许“连上 Broker 就可访问 vehicle/#”。ACL 将 Gateway 限制在自己的
# namespace，Fleet access 也只拥有必要的聚合/租约投递权限。
acl_file /mosquitto/config/mosquitto.acl

# 生产必须额外配置企业 CA 的 CRL/OCSP 同步和 Broker 高可用；开发 CA 没有
# 可用的撤销列表，因此此 compose 文件只可用于隔离开发和仿真。
